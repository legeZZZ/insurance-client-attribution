<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAI 经营归因 Agent | 业务闭环控制台 v5</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
/* 设计令牌逐字复刻 semifinal-demo.html */
:root {
  --bg: #eef3f5;   --paper: #ffffff;  --ink: #10242d;   --muted: #647680;
  --line: #d9e3e6; --nav: #0c1c25;    --nav-2: #102936;
  --cyan: #00a8a8; --cyan-soft: #e4f7f5;
  --blue: #1774c7; --blue-soft: #e8f2fc;
  --gold: #b57d13; --gold-soft: #fff5dc;
  --red: #c14643;  --red-soft: #fff0ee;
  --green: #16875f;--green-soft: #e7f7ef;
  --shadow: 0 12px 28px rgba(20, 43, 55, .08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}

/* 外壳：左侧 rail + 右侧 workspace（复刻 semifinal） */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.rail{background:var(--nav);color:#cfe4ea;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.rail .brand{padding:22px 22px 18px;border-bottom:1px solid rgba(125,194,207,.14)}
.rail .brand b{display:block;font-size:15px;color:#eafcff;letter-spacing:.5px}
.rail .brand span{font-size:11px;color:#7fa5b0;font-family:ui-monospace,Menlo,monospace}
.rail nav{flex:1;padding:14px 12px;overflow:auto}
.rail nav a{display:flex;align-items:center;gap:10px;padding:11px 12px;color:#a9c6cf;text-decoration:none;border-left:3px solid transparent;font-size:13px;position:relative}
.rail nav a .idx{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#5f8791;width:20px}
.rail nav a.active{background:var(--nav-2);color:#eafcff;border-left-color:var(--cyan)}
.rail nav a:hover{background:var(--nav-2)}
.nav-badge{margin-left:auto;min-width:20px;text-align:center;font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px;font-family:ui-monospace,Menlo,monospace}
.nav-badge.red{background:var(--red);color:#fff}
.nav-badge.gold{background:var(--gold);color:#fff}
.rail .foot{padding:14px 22px;border-top:1px solid rgba(125,194,207,.14);font-size:11px;color:#7fa5b0;font-family:ui-monospace,Menlo,monospace;line-height:1.8}
.workspace{min-width:0;display:flex;flex-direction:column}
.topbar{height:66px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 26px;position:sticky;top:0;z-index:30}
.topbar .crumb{font-size:14px;font-weight:600}
.topbar .crumb span{color:var(--muted);font-weight:400}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.mode-badge{font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:3px 10px;border:1px solid;border-radius:999px;font-weight:600}
.mode-badge.online{color:var(--green);background:var(--green-soft);border-color:#c2e6d4}
.mode-badge.offline{color:var(--gold);background:var(--gold-soft);border-color:#ecd9a8}
#operator-input{width:150px;padding:6px 10px;border:1px solid var(--line);background:#f7fafb;font-size:12px}
#operator-input:focus{outline:2px solid var(--cyan-soft);border-color:var(--cyan)}
.stage{max-width:1440px;width:100%;margin:0 auto;padding:22px 26px 60px}
.view{display:none}
.view.active{display:block}

/* 全局预警条 */
#alert-strip{margin:0 26px;margin-top:16px;border:1px solid;padding:10px 16px;display:flex;align-items:center;gap:14px;font-size:13px;background:var(--paper);box-shadow:var(--shadow)}
#alert-strip.calm{border-color:#c2e6d4;background:var(--green-soft);color:var(--green)}
#alert-strip.alarmed{border-color:#ecc9c7;background:var(--red-soft);color:var(--ink);cursor:pointer}
#alert-strip .cnt{font-weight:700;font-family:ui-monospace,Menlo,monospace}
#alert-strip .cnt.red{color:var(--red)}#alert-strip .cnt.gold{color:var(--gold)}
#alert-strip .latest{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
#alert-strip .go{color:var(--cyan);font-weight:600;white-space:nowrap}
#offline-strip{margin:6px 26px 0;padding:9px 16px;border:1px solid #ecd9a8;background:var(--gold-soft);color:#7a5c10;font-size:12px;display:none}
#offline-strip.show{display:block}
#offline-strip code{background:rgba(255,255,255,.6)}

.cc-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:14px}
.metric-card{background:var(--cc-panel);border:1px solid var(--cc-line);border-top:3px solid var(--cc-cyan);padding:12px 16px;cursor:pointer;transition:box-shadow .2s}
.metric-card:hover{box-shadow:0 0 24px rgba(87,228,208,.13)}
.metric-card.on{border-color:var(--cc-cyan);box-shadow:0 0 24px rgba(87,228,208,.2)}
.metric-card .m-name{font-size:13.5px;color:#eafcff;font-weight:600}
.metric-card .m-change{font-size:20px;font-family:ui-monospace,Menlo,monospace;color:var(--cc-cyan);margin:2px 0}
.metric-card .m-status{font-size:11px;color:var(--cc-orange)}
.metric-card .m-meta{font-size:11px;color:var(--cc-muted);margin-top:4px;font-family:ui-monospace,Menlo,monospace}
/* 深色指挥中心（复刻 semifinal 的 cc 体系） */
.command-center{--cc-bg:#07131d;--cc-panel:rgba(10,28,41,.86);--cc-panel-2:rgba(12,35,50,.74);--cc-line:rgba(125,194,207,.18);--cc-text:#e5f8f8;--cc-muted:#86a9b3;--cc-cyan:#57e4d0;--cc-blue:#5da7ff;--cc-purple:#9c8cff;--cc-orange:#ffb765;--cc-red:#ff7772;--cc-green:#73ff9f;background:var(--cc-bg);color:var(--cc-text);padding:26px 28px 34px;position:relative}
.command-center:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(125,194,207,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(125,194,207,.05) 1px,transparent 1px);background-size:32px 32px;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse at 30% 20%,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse at 30% 20%,#000 30%,transparent 75%)}
.command-center>*{position:relative}
.cc-head{display:flex;align-items:baseline;gap:16px;margin-bottom:18px}
.cc-head h2{font-size:19px;letter-spacing:1px;color:#eafcff}
.cc-head .sub{color:var(--cc-muted);font-size:12px;font-family:ui-monospace,Menlo,monospace}
.cc-head .clock{margin-left:auto;font-family:ui-monospace,Menlo,monospace;color:var(--cc-cyan);font-size:13px}
.cc-panel{background:var(--cc-panel);border:1px solid var(--cc-line);padding:16px 18px}
.cc-panel h3{font-size:12px;letter-spacing:1.5px;color:var(--cc-muted);font-weight:600;margin-bottom:12px;text-transform:uppercase}
.cc-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.kpi-card{background:var(--cc-panel);border:1px solid var(--cc-line);border-top:3px solid var(--cc-blue);padding:12px 14px}
.kpi-card .v{font-size:24px;font-family:ui-monospace,Menlo,monospace;color:#eafcff}
.kpi-card .l{font-size:11px;color:var(--cc-muted);margin-top:2px}
.kpi-card.cyan{border-top-color:var(--cc-cyan)}.kpi-card.gold{border-top-color:var(--cc-orange)}.kpi-card.red{border-top-color:var(--cc-red)}.kpi-card.green{border-top-color:var(--cc-green)}
.cc-main{display:grid;grid-template-columns:1.55fr .75fr;gap:14px;margin-bottom:14px}
.cc-network{position:relative;min-height:470px;padding:0}
#globe-stage{position:absolute;inset:0}
#globe-stage canvas{display:block}
.net-label{position:absolute;transform:translate(-50%,-130%);font-size:10px;font-family:ui-monospace,Menlo,monospace;color:var(--cc-muted);pointer-events:none;white-space:nowrap}
#globe-tooltip{position:absolute;display:none;background:rgba(4,14,20,.94);border:1px solid var(--cc-line);padding:10px 12px;font-size:12px;max-width:280px;pointer-events:none;z-index:5;line-height:1.6}
#globe-tooltip b{color:var(--cc-cyan);display:block;margin-bottom:2px}
.net-legend{position:absolute;left:16px;bottom:12px;display:flex;gap:14px;font-size:11px;color:var(--cc-muted)}
.net-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.sig-list .sig{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--cc-line);font-size:12.5px;align-items:flex-start}
.sig-list .sig:last-child{border-bottom:none}
.sig-list .dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none}
.sig-list .sig b{color:#eafcff}
.sig-list .sig .meta{color:var(--cc-muted);font-size:11px;font-family:ui-monospace,Menlo,monospace}
.sig-list .sig .jump{margin-left:auto;color:var(--cc-cyan);font-size:11px;cursor:pointer;white-space:nowrap}
.cc-flow{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
.cc-step{background:var(--cc-panel-2);border:1px solid var(--cc-line);padding:10px 12px;font-size:11px}
.cc-step .no{font-family:ui-monospace,Menlo,monospace;color:var(--cc-muted);font-size:10px}
.cc-step b{display:block;color:#d5eef0;font-size:12px;margin:2px 0}
.cc-step.done{border-top:2px solid var(--cc-cyan)}
.cc-step.active{border-top:2px solid var(--cc-orange);box-shadow:0 0 24px rgba(87,228,208,.13)}
.cc-lower{display:grid;grid-template-columns:1.08fr .92fr;gap:14px}
.log-stream{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:2;max-height:220px;overflow:auto}
.log-stream .t{color:var(--cc-muted);margin-right:8px}
.note-card{border:1px solid var(--cc-line);border-left:3px solid var(--cc-blue);padding:10px 12px;margin-bottom:10px;font-size:12px;background:var(--cc-panel-2)}
.note-card b{color:#eafcff;display:block;margin-bottom:2px}
.note-card.cyan{border-left-color:var(--cc-cyan)}.note-card.gold{border-left-color:var(--cc-orange)}.note-card.green{border-left-color:var(--cc-green)}
.cc-foot{margin-top:16px;padding-top:10px;border-top:1px dashed var(--cc-line);color:var(--cc-muted);font-size:11px;font-family:ui-monospace,Menlo,monospace}

/* 浅色区通用组件 */
.card{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);padding:18px 22px;margin-bottom:14px}
.card h3{font-size:15px;margin-bottom:12px}
.pill{display:inline-block;padding:1px 10px;font-size:11px;border:1px solid;border-radius:999px;font-weight:600}
.pill.cyan{color:var(--cyan);background:var(--cyan-soft);border-color:#bfe6e4}
.pill.blue{color:var(--blue);background:var(--blue-soft);border-color:#c4dcf2}
.pill.gold{color:var(--gold);background:var(--gold-soft);border-color:#ecd9a8}
.pill.red{color:var(--red);background:var(--red-soft);border-color:#ecc9c7}
.pill.green{color:var(--green);background:var(--green-soft);border-color:#c2e6d4}
.pill.violet{color:#6b5ce7;background:#efedfd;border-color:#d6cff8}
.btn{padding:6px 14px;border:1px solid var(--cyan);background:var(--cyan);color:#fff;font-size:12px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:#fff;color:var(--cyan)}
.btn.danger{background:var(--red);border-color:var(--red)}
.btn.warn{background:var(--gold);border-color:var(--gold)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:3px 10px;font-size:11px}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:4px 12px;border:1px solid var(--line);background:#fff;font-size:12px;color:var(--muted);border-radius:999px;cursor:pointer}
.chip.on{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-soft);font-weight:600}

/* 预警卡 */
.alert-card{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);padding:16px 20px;margin-bottom:12px;border-left:4px solid var(--gold)}
.alert-card.high{border-left-color:var(--red)}
.alert-card .head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.alert-card .head b{font-size:15px}
.alert-card .row{font-size:13px;margin:6px 0;color:#28414c}
.alert-card .row b{color:var(--ink)}
.alert-card .basis{background:#f7fafb;border:1px solid var(--line);padding:10px 12px;font-size:12px;margin:8px 0;line-height:1.7}
.alert-card .ops{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.alert-card .state-tag{margin-left:auto;font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.spark{width:220px;height:44px;display:block}
.falsify{font-size:12px;color:var(--muted);margin-top:6px}
.falsify .pass{color:var(--green)}.falsify .fail{color:var(--red)}
.jump-link{color:var(--cyan);cursor:pointer;font-size:12px;font-weight:600}

/* 待办看板 */
.todo-flow{display:flex;gap:0;margin-bottom:18px}
.todo-flow .node{flex:1;background:var(--paper);border:1px solid var(--line);padding:12px 14px;position:relative;text-align:center}
.todo-flow .node+.node{border-left:none}
.todo-flow .node+.node:before{content:"→";position:absolute;left:-7px;top:38%;background:var(--bg);color:var(--muted);font-size:12px;z-index:2}
.todo-flow .node b{font-size:13px;display:block}
.todo-flow .node .cnt{font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:700;margin-top:4px}
.todo-flow .node.has{border-top:3px solid var(--cyan);box-shadow:0 0 24px rgba(0,168,168,.12)}
.todo-flow .node .cnt.zero{color:#b9c8cd}
.todo-group{margin-bottom:18px}
.todo-group>h3{font-size:13px;color:var(--muted);letter-spacing:1px;margin-bottom:8px}
.todo-item{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.todo-item .info{flex:1;min-width:0}
.todo-item .info b{font-size:13.5px}
.todo-item .info .meta{font-size:11.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;margin-top:2px}
/* 详情滑出面板 */
#drawer-mask{position:fixed;inset:0;background:rgba(12,28,37,.45);display:none;z-index:40}
#drawer{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:92vw;background:var(--bg);border-left:1px solid var(--line);box-shadow:-16px 0 40px rgba(20,43,55,.2);z-index:41;display:none;overflow:auto;padding:24px 26px}
#drawer.open,#drawer-mask.open{display:block}
#drawer h3{font-size:16px;margin-bottom:4px}
#drawer .close{position:absolute;top:14px;right:16px;border:none;background:none;font-size:18px;color:var(--muted)}
.rule-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.rule{border:1px solid;padding:10px 12px;font-size:12px;line-height:1.7}
.rule.can{border-color:#c2e6d4;background:var(--green-soft)}
.rule.cannot{border-color:#ecc9c7;background:var(--red-soft)}
.rule b{display:block;margin-bottom:3px;font-size:12px}
.rule.can b{color:var(--green)}.rule.cannot b{color:var(--red)}
.evidence-box{background:#fff;border:1px solid var(--line);padding:12px 14px;font-size:12.5px;margin:10px 0;line-height:1.8}
#drawer label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
#drawer input,#drawer select,#drawer textarea{width:100%;padding:8px 10px;border:1px solid var(--line);background:#fff;font-size:13px}
#drawer .ops{display:flex;gap:8px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:var(--nav);color:#eafcff;padding:10px 18px;font-size:13px;z-index:60;box-shadow:var(--shadow);display:none;max-width:80vw}
.toast.err{background:var(--red)}

/* 因子库卡片网格（复刻 cc-library-grid 语义） */
.library-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.library-card{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);padding:14px 16px 12px 18px;position:relative;border-left:3px solid var(--blue);cursor:default}
.library-card.external{border-left-color:#6b5ce7}
.library-card.unknown{border-left-color:var(--gold)}
.library-card.research{border-left-color:#94a8b0;border-style:dashed;background:#fafcfd}
.library-card.verified:after{content:"";position:absolute;top:10px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.library-card b{font-size:13px;display:block;margin-bottom:3px;padding-right:16px}
.library-card .fid{font-size:10.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;word-break:break-all}
.library-card .tags{margin:7px 0;display:flex;gap:5px;flex-wrap:wrap}
.library-card .strength{height:5px;background:#e7eef0;margin-top:8px}
.library-card .strength i{display:block;height:100%;background:var(--cyan)}
.library-card .sl{font-size:10.5px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;font-family:ui-monospace,Menlo,monospace}
.library-card.alerted{border-left-color:var(--red)}
.plan-two{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px}
.log-list{margin:6px 0 12px;padding-left:18px;font-size:12.5px;color:var(--ink);line-height:1.65}
.log-list li{margin-bottom:5px}
@media (max-width:1100px){.plan-two{grid-template-columns:1fr}}
.plan-panel{margin-bottom:12px}
.plan-frame{width:100%;height:72vh;border:1px solid var(--line);border-radius:10px;background:#fff;display:block}
.library-card.alerted:before{content:"⚠";position:absolute;top:8px;right:26px;color:var(--red);font-size:13px}

/* 因子管理表 */
table.full{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--paper)}
table.full th,table.full td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.full th{background:#f4f8f9;font-weight:600;white-space:nowrap}
.st-ok{color:var(--green);font-weight:600}.st-off{color:var(--muted)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.form-grid .full-row{grid-column:1/-1}
.card label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.card input,.card select,.card textarea{width:100%;padding:8px 10px;border:1px solid var(--line);background:#fff;font-size:13px}

/* 自进化时间线 */
.skill-card{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);padding:16px 20px;margin-bottom:12px}
.skill-card .head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.skill-card .head b{font-size:15px}
.stage-bar{display:flex;gap:0;margin:10px 0}
.stage-bar .st{flex:1;text-align:center;font-size:11px;padding:7px 4px;border:1px solid var(--line);color:var(--muted);background:#f7fafb}
.stage-bar .st+.st{border-left:none}
.stage-bar .st.hit{background:var(--cyan-soft);color:var(--cyan);border-color:#bfe6e4;font-weight:700}
.stage-bar .st.now{background:var(--gold-soft);color:var(--gold);border-color:#ecd9a8;font-weight:700}
.timeline{font-size:12.5px;line-height:2}
.timeline .t{color:var(--muted);font-family:ui-monospace,Menlo,monospace;margin-right:8px;font-size:11px}
.neg-item{border:1px solid #ecc9c7;background:var(--red-soft);padding:9px 12px;margin-bottom:8px;font-size:12.5px}
.bound-item{border:1px solid var(--line);background:#f7fafb;padding:9px 12px;margin-bottom:8px;font-size:12.5px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}

@media (max-width:1100px){.library-grid{grid-template-columns:repeat(2,1fr)}.cc-kpis{grid-template-columns:repeat(3,1fr)}.cc-main,.cc-lower,.two-col{grid-template-columns:1fr}.cc-flow{grid-template-columns:repeat(3,1fr)}}
@media (max-width:780px){.app{grid-template-columns:1fr}.rail{position:static;height:auto}.rail nav{display:flex;flex-wrap:wrap}.library-grid{grid-template-columns:1fr}}
/* Business journey workspace: evidence and decisions before network exploration. */
.rail nav{overflow-y:auto}.rail nav a{padding:11px 20px}.rail .brand span{letter-spacing:1px}
.ws-hero{position:relative;background:#102b36;color:#eefafa;padding:30px 32px;margin-bottom:20px;overflow:hidden;border-radius:4px}

const LS_LEDGER = 't2_v3_ledger';
const LS_OPERATOR = 't2_v3_operator';

const ENDPOINTS = ['overview','factors','watchlist','alerts','conflicts','skills','evidence','factors/ledger','feedback/queue','workspace'];

async function fetchAll(){
  const keys = ['overview','factors','watchlist','alerts','conflicts','skills','evidence','ledger','queue','workspace'];
  const res = await Promise.all(ENDPOINTS.map(e=>fetch('/api/v2/'+e,{cache:'no-store',signal:typeof AbortSignal.timeout==='function'?AbortSignal.timeout(15000):undefined}).then(r=>{if(!r.ok)throw new Error('API '+r.status);return r.json()})));
  const out = {}; keys.forEach((k,i)=>out[k]=res[i]);
  const previous = (out.workspace?.artifacts||[]).find(a=>a.id==='line_b')?.data;
  out.bline_candidates = (previous?.key_outputs?.association_discovery?.candidates||[]).slice(0,40).map(c=>({factor_id:c.factor_id, derived_feature_id:c.derived_feature_id||c.factor_id+(c.start_day!=null?'@'+c.start_day:''), derived_layer:c.derived_layer, kind:c.factor_id.startsWith('internal.')?'internal':'external', claim_type:c.claim_type||'TEMPORAL_ASSOCIATION', association_score:c.alignment_score||c.association_score||0, lag_days:c.lag_days??c.distance_days, license_ref:c.license_ref}));
  return out;
}

function ledger(){ try{return JSON.parse(localStorage.getItem(LS_LEDGER)||'[]')}catch(e){return[]} }
function pushLedger(entry){ const l=ledger(); l.push({...entry, at:new Date().toISOString()}); localStorage.setItem(LS_LEDGER, JSON.stringify(l)); }
function operator(){ const v=document.getElementById('operator-input').value.trim(); if(!v){ toast('请先填写右上角「操作人」，所有人工操作需要留痕身份', true); throw new Error('operator required'); } return v; }
function rid(){ return 'v3-'+Date.now()+'-'+Math.random().toString(36).slice(2,8); }
function toast(msg, err){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast'+(err?' err':''); t.style.display='block'; clearTimeout(t._tm); t._tm=setTimeout(()=>t.style.display='none', 3600); }

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function pct(x){ return Math.round(Math.abs(x||0)*100)+'%'; }
function zhDir(d){ return d==='positive'?'正向':d==='negative'?'负向':(d||'—'); }
const KIND_LABEL = {internal_event:'内部事件', external_event:'外部事件', factor_series:'因子序列', operator_entry:'人工补录', internal_registry:'内部登记', public_monitor:'公开监测', 'operator-entry':'人工补录'};

/* 归一化：把 snapshot / live 统一成页面模型 */
function normalize(raw){
  const alerts = (raw.alerts&&raw.alerts.alerts)||[];
  const factors = (raw.factors&&raw.factors.factors)||[];
  const wl = (raw.watchlist&&raw.watchlist.items)||[];
  const skills = (raw.skills&&raw.skills.skills)||[];
  const releases = (raw.skills&&raw.skills.releases)||[];
  const conflicts = (raw.conflicts&&raw.conflicts.conflicts)||[];
  const bline = raw.bline_candidates||[];

  // 因子库卡片：registry 因子 + B 线候选合并去重
  const cards = [];
  const seen = new Set();
  const alertFactor = new Set(alerts.filter(a=>a.level==='high'&&a.state.status==='open').map(a=>a.factor_id));
  factors.forEach(f=>{
    seen.add(f.factor_id);
    const research = f.status==='research_candidate' || f.kind==='research_candidate';
    const verified = !research && f.claim_type==='FACTOR_CANDIDATE';
    const route = research ? 'research'
                : f.kind==='internal_event'||f.source_type==='internal_registry' ? 'internal'
                : f.source_type==='operator-entry'||f.kind==='operator_entry' ? 'internal'
                : 'external';
    cards.push({ fid:f.factor_id, name:f.name||f.factor_id, route,
      status: research?'research':(f.status==='disabled'?'disabled':(verified?'verified':(f.strength!=null?'watch':'candidate'))),
      claim: research?'研究候选':(f.claim_type||'—'), strength:f.strength, lag:f.lag,
      src: f.source_type, license:f.license_ref, evidence_count:f.evidence_count||0,
      family:f.family, priority:f.priority, formula:f.formula, data_source:f.data_source,
      alerted: alertFactor.has(f.factor_id) });
  });
  bline.forEach(c=>{
    const cid = c.derived_feature_id || c.factor_id;
    if(seen.has(cid)) return; seen.add(cid);
    const route = c.kind==='internal'?'internal':(c.kind==='external'?'external':'unknown');
    cards.push({ fid:cid, name:zhName(cid), route, status:'candidate',
      claim:c.claim_type||'FACTOR_CANDIDATE', strength:Math.abs(c.association_score||0),
      lag:c.lag_days, src:'B线候选挖掘', license:c.license_ref, evidence_count:0,
      layer:c.derived_layer, alerted:false });
  });
  // 本地离线新增的因子
  (MODE==='service'?[]:ledger()).filter(e=>e.type==='factor_create').forEach(e=>{
    if(seen.has(e.factor.factor_id)) return; seen.add(e.factor.factor_id);
    cards.push({ fid:e.factor.factor_id, name:e.factor.name, route:'internal', status:'candidate',
      claim:'OPERATOR_ENTRY', strength:null, lag:null, src:'operator-entry(本地)',
      license:'内部登记', evidence_count:0, alerted:false, local:true });
  });
  // 离线停用状态
  const localStatus = {};
  (MODE==='service'?[]:ledger()).filter(e=>e.type==='factor_status').forEach(e=>localStatus[e.factor_id]=e.status);
  cards.forEach(c=>{ if(localStatus[c.fid]) c.status = localStatus[c.fid]==='disabled'?'disabled':c.status; });

  return { workspace:raw.workspace||{}, alerts, factors, wl, skills, releases, conflicts, cards,
           evidence: raw.evidence||{}, overview: raw.overview||{},
           metrics: (raw.overview&&raw.overview.metrics)||[],
           bline_candidates: bline,
           queue: (raw.queue&&raw.queue.queue)||[], recent:(raw.queue&&raw.queue.recent)||[],
           versions:(raw.ledger&&raw.ledger.ledger)||[],
           skillsSuiteRef: (raw.skills&&raw.skills.demo_suite_ref)||'' };
}

/* 待办装配：四类节点 */
function buildTodos(){
  const done = new Set(MODE==='service'?[]:ledger().filter(e=>e.type==='todo_done').map(e=>e.key));
  const reviewed = new Set((D.recent||[]).filter(e=>e.kind==='candidate_review').map(e=>e.payload.factor_id));
  const t = {1:[],2:[],3:[],4:[]};
  D.wl.forEach(w=>{ if(w.claim_type!=='FACTOR_CANDIDATE' && !w.feedback_label && !reviewed.has(w.factor_id))
    t[1].push({key:'cand-'+w.alert_id, title:w.factor_id+' · lag '+w.lag,
      meta:'相关 '+pct(w.correlation)+' · '+w.claim_type+' · 校正p '+(w.adjusted_pvalue??'—'), data:w}); });
  D.conflicts.forEach(c=>{ if(c.status==='open')
    t[2].push({key:'conf-'+c.id, title:c.title, meta:c.lines.join('/')+' 线 · '+c.status, data:c}); });
  D.skills.forEach(s=>{
    const st = s.trust_state;
    if(!s.execution_eligible && (st==='validated' || s.validated))
      t[3].push({key:'skill-'+s.name, title:'技能 '+s.name+' v'+s.version+' 已验证，待审批发布', meta:'trust: '+st, data:s});
    else if(st==='provisional')
      t[3].push({key:'skill-'+s.name, title:'技能 '+s.name+' v'+s.version+' 提案待评审', meta:'trust: provisional', data:s});
  });
  const localAlert = new Set(MODE==='service'?[]:ledger().filter(e=>e.type==='alert_action').map(e=>e.alert_id));
  D.alerts.forEach(a=>{ if(a.state.status==='open' && !localAlert.has(a.alert_id))
    t[4].push({key:'fb-'+a.alert_id, title:'预警「'+a.title+'」待标注价值', meta:a.level==='high'?'高风险':'关注', data:a}); });
  [1,2,3,4].forEach(k=>{ t[k]=t[k].filter(x=>!done.has(x.key)); });
  return t;
}

/* ================= 动作层：双模式 ================= */
async function act(endpoint, body, offlineEntry, doneMsg){
  body.request_id = rid();
  if(MODE==='service'){
    try {
    const r = await fetch('/api/v2/'+endpoint, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    const j = await r.json();
    if(!r.ok || j.error){ toast(j.error||'操作被拒绝', true); return false; }
    toast(j.note||doneMsg||'已提交治理层');
    await reload(); return true;
    }catch(e){toast('操作未完成：'+e.message,true);return false;}
  }
  pushLedger({...offlineEntry, request_id:body.request_id, operator:body.operator});
  toast((doneMsg||'已记录')+'（离线：未提交治理层）');
  if(offlineEntry && offlineEntry.type==='todo_done'){}
  await reload(); return true;
}
async function reload(){
  if(MODE==='service'){ D = normalize(await fetchAll()); }
  else { D = normalize(INLINE); }
  renderAll();
}

  if(location.hash !== '#'+name) history.replaceState(null,'','#'+name);
  if(name==='lab' && !document.getElementById('globe-stage') && typeof renderNetwork==='function') renderNetwork();
  window.scrollTo(0,0);
}

function renderStrip(){
  const strip = document.getElementById('alert-strip');
  const open = D.alerts.filter(a=>a.state.status==='open');
  const high = open.filter(a=>a.level==='high'), watch = open.filter(a=>a.level!=='high');
  const nbA = document.getElementById('nb-alerts');
  if(high.length){ nbA.style.display=''; nbA.textContent=high.length; } else nbA.style.display='none';
  const todos = buildTodos(); const todoCnt = tAll(todos).length;
  const nbT = document.getElementById('nb-todo');
  if(todoCnt){ nbT.style.display=''; nbT.textContent=todoCnt; } else nbT.style.display='none';
  if(!open.length){
    strip.className='calm';
    strip.innerHTML='✓ 当前无待处置风险 · C 线盯防中（盯防信号 '+D.wl.length+' 条）';
    return;
  }
  strip.className='alarmed';
  const latest = open[0];
  strip.innerHTML = '<span class="cnt red">⚠ '+high.length+' 条高风险</span><span class="cnt gold">'+watch.length+' 条关注</span>'
    + '<span class="latest">最近：'+esc(latest.title)+' — '+esc(latest.impact||'')+'</span>'
    + '<span class="go">进入预警中心 →</span>';
  strip.onclick = ()=>showView('alerts');
}
function tAll(t){ return [...t[1],...t[2],...t[3],...t[4]]; }
</script>
<script>
/* ================= 01 归因总控 ================= */
const ZH_NAME = {'campaign.sms_push':'短信触达','channel.feed_ad':'信息流投放','competitor.delisting':'竞品下架','market.noise_index':'大盘噪声指数','homepage.carousel_exposure':'首页轮播曝光','external.fx_rate_usd_cny':'美元兑人民币汇率','internal.checkout_error_rate':'结算错误率','internal.page_latency_p95':'页面延迟P95','external.competitor_pressure_index':'竞品压力指数','internal.audit.unregistered_release':'未登记发布动作','internal.payment_gateway_maintenance':'支付网关维护','internal.vendor.sms_provider_switch':'短信服务商切换','internal.pricing_rule_hotfix':'定价规则热修','internal.underwriting_rule_queue_change':'核保规则变更','quality.tracking_schema_gap':'埋点Schema缺口','external.competitor_price_drop':'竞品降价','external.aggregator_homepage_slot_loss':'聚合平台首页位丢失','external.broker_affiliate_push':'经纪联盟推送','external.market_rate_announcement':'市场利率公告','external.competitor_campaign':'竞品营销活动','external.negative_review_wave':'差评潮','internal.form_validation_error_rate':'表单校验错误率','internal.quote_form_step_count':'报价表单步数','internal.premium_quote_cache_miss_rate':'保费报价缓存未命中','internal.esign_redirect_exit_rate':'电签跳转退出率','internal.price_explanation_view_gap_rate':'价格说明查看缺口','internal.app_crash_rate':'App崩溃率','quality.tracking_gap_rate':'埋点缺口率','internal.channel_bid_cpc':'渠道出价CPC','external.regulatory_notice_density':'监管公告密度'};
const ZH_LAYER = {level:'水平',velocity:'增速',acceleration:'加速度'};
function zhName(fid){
  let base=String(fid).split('@')[0], layer='';
  const m = base.match(/\.(level|velocity|acceleration)$/);
  if(m){ layer='·'+ZH_LAYER[m[1]]; base=base.slice(0,-m[0].length); }
  if(ZH_NAME[base]) return ZH_NAME[base]+layer;
  const card = (D&&D.cards||[]).find(c=>c.fid===fid);
  if(card && /[一-龥]/.test(card.name)) return card.name;
  return '未登记因子·'+base.split('.').pop()+layer;
}
function renderNetwork(){
  const el = document.getElementById('view-network');
  const open = D.alerts.filter(a=>a.state.status==='open');
  const high = open.filter(a=>a.level==='high').length;
  const todos = tAll(buildTodos()).length;
  const verified = D.cards.filter(c=>c.status==='verified').length;
  const kpis = [
    {v:D.wl.length, l:'C 线盯防信号', cls:'cyan'},
    {v:high, l:'高风险预警', cls:high?'red':'cyan'},
    {v:todos, l:'待办（人在回路）', cls:todos?'gold':'cyan'},
    {v:verified, l:'已验证因子', cls:'green'},
    {v:D.skills.length, l:'治理中技能', cls:''},
  ];
  const recentStream = buildStream();
  el.innerHTML = `
  <div class="command-center">
    <div class="cc-head"><h2>归因总控 · 因子证据球</h2>
      <span class="sub">异动指标 × 关联因子 × 置信度 · ${MODE==='service'?'HTTP 实机管线':'本地脱敏数据回放'}</span>
      <span class="clock" id="cc-clock"></span></div>
    <div class="cc-kpis">${kpis.map(k=>`<div class="kpi-card ${k.cls}"><div class="v">${k.v}</div><div class="l">${k.l}</div></div>`).join('')}</div>
    <div class="cc-metrics" id="cc-metrics"></div>
    <div class="cc-main">
      <div class="cc-panel cc-network"><h3>证据关系图 · 青色环=异动指标 · 边：绿粗=因果已确认 / 青实=关联已验证 / 蓝实=A/B 验证中 / 金虚=算法可疑待确认 / 紫虚=外部时间关联 · 标签数字=置信度 · 金环✦=人为确认过 · 绿环=历史验证通过 · 线框小节点=导数派生值 · 点因子可跳转</h3>
        <div id="globe-stage"></div><div id="globe-tooltip"></div>
      </div>
      <div class="cc-panel"><h3>待复核清单</h3><div class="sig-list" id="sig-list"></div></div>
    </div>
    <div class="cc-lower">
      <div class="cc-panel"><h3>Event Stream</h3><div class="log-stream">${recentStream}</div></div>
      <div class="cc-panel"><h3>Decision Surface</h3>
        <div class="note-card green"><b>已验证</b>${esc((D.cards.find(c=>c.status==='verified')||{}).name||'—')} · 独立窗口确认，进入因子库绿环</div>
        <div class="note-card gold"><b>未知量保留</b>未解释残差桶保留，不强行归因（UNEXPLAINED 是证据状态，不是失败）</div>
        <div class="note-card cyan"><b>建议动作</b>${esc((D.alerts.find(a=>a.state.status==='open')||{}).suggestion||'当前无待处置建议')}</div>
        <div class="note-card"><b>口径</b>统计口径与负结果见「技能与自进化」</div>
      </div>
    </div>
    <div class="cc-foot">EVIDENCE BOUNDARY · 无随机化证据只输出关联级结论 · 反馈不自动晋升任何结论</div>
  </div>`;
  renderMetricsBoard();
  renderSigList();
  initGlobe();
  if(!window._clock){ window._clock=setInterval(()=>{ const c=document.getElementById('cc-clock'); if(c) c.textContent=new Date().toLocaleString('zh-CN',{hour12:false}); },1000); }
}
let SELECTED_METRIC = null;
function renderMetricsBoard(){
  const el = document.getElementById('cc-metrics'); if(!el) return;
  el.innerHTML = (D.metrics||[]).map(m=>`
    <div class="metric-card ${SELECTED_METRIC===m.id?'on':''}" onclick="selectMetric('${m.id}')">
      <div class="m-name">${esc(m.name)}</div>
      <div class="m-change">${esc(m.change)}</div>
      <div class="m-status">${esc(m.status)}</div>
      <div class="m-meta">关联因子 ${(m.factors||[]).length} 个 · ${esc(m.window||'')}</div>
    </div>`).join('');
}
function selectMetric(id){
  SELECTED_METRIC = SELECTED_METRIC===id ? null : id;
  renderMetricsBoard();
  if(globeApi && globeApi.selectMetric) globeApi.selectMetric(SELECTED_METRIC);
}
function renderSigList(){
  const el = document.getElementById('sig-list'); if(!el) return;
  const rows = [];
  D.alerts.filter(a=>a.state.status==='open').forEach(a=>{
    rows.push({color:a.level==='high'?'#ff7772':'#ffb765', title:a.title,
      meta:(a.type==='conflict'?'冲突预警':'趋势预警')+(a.correlation!=null?' · 相关 '+pct(a.correlation):''),
      jump:"openAlertFromGlobe('"+a.alert_id+"')"});
  });
  D.wl.filter(w=>w.claim_type!=='FACTOR_CANDIDATE').slice(0,3).forEach(w=>{
    rows.push({color:'#5da7ff', title:w.factor_id+' · lag '+w.lag, meta:'盯防中 · 相关 '+pct(w.correlation),
      jump:"showView('todo')"});
  });
  el.innerHTML = rows.map(r=>`<div class="sig"><span class="dot" style="background:${r.color}"></span>
    <div><b>${esc(r.title)}</b><div class="meta">${esc(r.meta)}</div></div>
    <span class="jump" onclick="${r.jump}">处理 →</span></div>`).join('')
    || '<div class="sig"><div style="color:var(--cc-muted)">无待复核事项</div></div>';
}
function buildStream(){
  const evts = [];
  (D.recent||[]).slice(0,6).forEach(e=>{ const p=(e.payload||{}); evts.push({t:(e.at||'').slice(5,16)||'—', s:'人工反馈 · '+(p.alert_id||p.factor_id||'')+' · '+(p.label||p.action||'')}); });
  D.releases.slice(0,4).forEach(r=>evts.push({t:'治理', s:'技能 '+(r.name||'')+' · '+(r.action||r.kind||'release')}));
  evts.push({t:'管线', s:'C 线扫描完成 · 盯防 '+D.wl.length+' 条'});
  evts.push({t:'管线', s:'独立窗口确认完成 · 已验证 '+D.cards.filter(c=>c.status==='verified').length+' 条'});
  ledger().slice(-5).forEach(l=>evts.push({t:'本地', s:'离线留痕 · '+(l.type||'')+' · '+(l.operator||'')}));
  return evts.map(e=>`<div><span class="t">${esc(e.t)}</span>${esc(e.s)}</div>`).join('');
}

/* ================= 3D 证据球（复刻 semifinal 架构 + 2D fallback） ================= */
const CLAIM_ZH = {CAUSAL_CONFIRMED:'因果已确认（A 线实验）', FACTOR_CANDIDATE:'关联已验证（独立窗口确认）', WATCHLIST:'算法可疑 · 待人工确认', AB_TESTING:'A/B 验证中', TEMPORAL_ASSOCIATION:'外部时间关联'};
const CLAIM_EDGE = {CAUSAL_CONFIRMED:'causal', FACTOR_CANDIDATE:'assoc', WATCHLIST:'watch', AB_TESTING:'abtest', TEMPORAL_ASSOCIATION:'temporal'};
function globeData(){
  /* 结构 = 异动指标（中心层）↔ 因子（球壳层），边 = 管线输出的归因关联 */
  const metrics = (D.metrics && D.metrics.length ? D.metrics
    : [{id:'residual', name:'残余异动（未解释成分）', factors:[]}]);
  const alertFids = new Set(D.alerts.filter(a=>a.level==='high'&&a.state.status==='open').map(a=>a.factor_id));
  /* 人为确认过的因子：治理留痕（服务端反馈 + 本地台账） */
  const humanOk = new Set((D.recent||[]).map(e=>(e.payload||{}).factor_id).filter(Boolean));
  ledger().filter(e=>['feedback','experiment_request','investigation_supplement'].includes(e.type)).forEach(e=>{ const f=(e.payload&&e.payload.factor_id)||e.factor_id; if(f) humanOk.add(f); });
  const nodes=[], edges=[], fseen=new Set();
  metrics.forEach((m,i)=> nodes.push({id:'metric:'+m.id, label:m.name, kind:'metric', mi:i}));
  metrics.forEach(m=> (m.factors||[]).forEach(l=>{
    const derived = l.layer && l.layer!=='level';
    edges.push({a:'metric:'+m.id, b:l.factor_id, metric:m.id,
      strength:l.strength, lag:l.lag, claim:l.claim, layer:l.layer||'level',
      style: CLAIM_EDGE[l.claim]||'watch'});
    if(!fseen.has(l.factor_id+(l.layer||''))){ fseen.add(l.factor_id+(l.layer||''));
      const card = D.cards.find(c=>c.fid===l.factor_id);
      nodes.push({id:l.factor_id, label:zhName(l.factor_id)+(derived?'·'+ZH_LAYER[l.layer]:''),
        fid:l.factor_id, conf:l.strength, human:humanOk.has(l.factor_id),
        kind: alertFids.has(l.factor_id)?'alerted':(l.claim==='CAUSAL_CONFIRMED'||l.claim==='FACTOR_CANDIDATE'?'verified':((card&&card.route)||'internal')),
        derived: !!derived, strength:l.strength, lag:l.lag, claim:l.claim, idx:nodes.length});
    }
  }));
  nodes.push({id:'unknown', label:'未解释残差', kind:'unknown', idx:nodes.length});
  edges.push({a:'metric:'+metrics[0].id, b:'unknown', metric:metrics[0].id, style:'temporal'});
  /* 异动实验进行中：只显现已检验的因子节点，关联关系随链路推进逐步出现 */
  if(window._expReveal){
    const R = window._expReveal;
    const e2 = edges.filter(e=>R.has(e.b));
    const keep = new Set(); e2.forEach(e=>{keep.add(e.a);keep.add(e.b);});
    return {nodes:nodes.filter(n=>n.kind==='metric'||keep.has(n.id)), edges:e2};
  }
  return {nodes, edges};
}
const NODE_COLOR = {metric:0x57e4d0, internal:0x5da7ff, external:0x9c8cff, unknown:0xffb765, verified:0x73ff9f, alerted:0xff7772};
const EDGE_COLOR = {assoc:0x57e4d0, watch:0xffb765, abtest:0x5da7ff, temporal:0x9c8cff, causal:0x73ff9f};

function initGlobe(){
  const stage = document.getElementById('globe-stage');
  if(!stage) return;
  stage.innerHTML='';
  document.querySelectorAll('.net-label').forEach(n=>n.remove());
  const {nodes, edges} = globeData();
  if(window.THREE){ try{ globeApi = initGlobe3D(stage, nodes, edges); return; }catch(e){} }
  globeApi = initGlobe2D(stage, nodes, edges);
}

function metricPos(n, count){
  /* 异动指标放中心层：单指标居中，多指标沿纵向排开 */
  if(count===1) return new THREE.Vector3(0,0,0);
  return new THREE.Vector3(0, (n.mi-(count-1)/2)*1.05, 0);
}

function initGlobe3D(stage, nodes, edges){
  const W = stage.clientWidth||600, H = stage.clientHeight||470;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(34, W/H, .1, 100); camera.position.set(0,.2,7.6);
  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setSize(W,H); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  stage.appendChild(renderer.domElement);
  scene.add(new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.SphereGeometry(2.35,24,16)), new THREE.LineBasicMaterial({color:0x3b8b99,transparent:true,opacity:.13})));
  scene.add(new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.SphereGeometry(2.52,24,16)), new THREE.LineBasicMaterial({color:0x57e4d0,transparent:true,opacity:.04})));
  const metricCount = nodes.filter(n=>n.kind==='metric').length;
  const outers = nodes.filter(n=>n.kind!=='metric');
  const meshes = {}; const labels=[];
  nodes.forEach(n=>{
    if(n.kind==='metric'){
      const m = new THREE.Mesh(new THREE.IcosahedronGeometry(.24,0), new THREE.MeshBasicMaterial({color:0x57e4d0,wireframe:true}));
      m.position.copy(metricPos(n, metricCount)); scene.add(m);
      const core = new THREE.Mesh(new THREE.IcosahedronGeometry(.1,0), new THREE.MeshBasicMaterial({color:0x57e4d0}));
      core.position.copy(m.position); scene.add(core);
      meshes[n.id]={m, core, base:.24, n};
    } else {
      const i = n.idx, total = outers.length;
      let pos;
      if(n.kind==='unknown') pos = new THREE.Vector3(0,-2.1,0);
      else { const phi = Math.acos(1-2*(i+.5)/total), theta = Math.PI*(1+Math.sqrt(5))*i;
        pos = new THREE.Vector3(2.35*Math.sin(phi)*Math.cos(theta), 2.35*Math.cos(phi)*.8, 2.35*Math.sin(phi)*Math.sin(theta)); }
      const size = (.06 + Math.min(.08, (n.strength||0)*.09)) * (n.derived? .7 : 1);
      const m = new THREE.Mesh(new THREE.IcosahedronGeometry(size,0),
        new THREE.MeshBasicMaterial({color:NODE_COLOR[n.kind]||0x5da7ff, wireframe:!!n.derived}));
      m.position.copy(pos); scene.add(m);
      const hit = new THREE.Mesh(new THREE.SphereGeometry(.22,8,8), new THREE.MeshBasicMaterial({visible:false}));
      hit.position.copy(pos); scene.add(hit); hit.userData.node=n;
      const pack = {m, hit, base:size, n};
      if(n.kind==='alerted'||n.kind==='verified'||n.human){
        const ring = new THREE.Mesh(new THREE.TorusGeometry(size+.06,.012,8,32),
          new THREE.MeshBasicMaterial({color:n.human?0xffb765:(n.kind==='alerted'?0xff7772:0x73ff9f), transparent:true, opacity:.85}));
        ring.position.copy(pos); scene.add(ring); pack.ring=ring;
      }
      if(n.human){
        const ring2 = new THREE.Mesh(new THREE.TorusGeometry(size+.11,.008,8,32),
          new THREE.MeshBasicMaterial({color:0xffb765, transparent:true, opacity:.5}));
        ring2.position.copy(pos); scene.add(ring2);
      }
      meshes[n.id]=pack;
    }
    const div = document.createElement('div'); div.className='net-label';
    if(n.kind==='metric'){ div.style.color='#57e4d0'; div.style.fontWeight='700'; }
    if(n.human) div.style.color='#ffb765';
    div.textContent=n.label+(n.kind!=='metric'&&n.conf!=null?' · '+Math.round(Math.abs(n.conf)*100)+'%':'')+(n.human?' ✦':'');
    stage.parentElement.appendChild(div); labels.push({div, pack:meshes[n.id]});
  });
  /* 边：因子 ↔ 异动指标；线型 = 关联等级，粗细/透明度 = 关联强度 */
  const edgeObjs = [];
  edges.forEach(e=>{
    const A=meshes[e.a], B=meshes[e.b]; if(!A||!B) return;
    const rec = {metric:e.metric, objs:[]};
    if(e.style==='causal' || e.style==='assoc' || e.style==='abtest'){
      const r = e.style==='causal' ? .012+.02*(e.strength||.5) : .006+.012*(e.strength||.3);
      const tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(A.m.position,B.m.position),1,r,6),
        new THREE.MeshBasicMaterial({color:EDGE_COLOR[e.style],transparent:true,opacity:e.style==='causal'?.9:.75}));
      scene.add(tube); rec.objs.push(tube);
    } else {
      const g = new THREE.BufferGeometry().setFromPoints([A.m.position, B.m.position]);
      const mat = new THREE.LineDashedMaterial({color:EDGE_COLOR[e.style], dashSize:.08, gapSize:.06, transparent:true, opacity:.3+.5*(e.strength||0)});
      const line = new THREE.Line(g, mat); line.computeLineDistances(); scene.add(line); rec.objs.push(line);
    }
    edgeObjs.push(rec);
  });
  let tx=0, ty=0, drag=false, px=0, py=0;
  const ray = new THREE.Raycaster(); const mv = new THREE.Vector2();
  const tip = document.getElementById('globe-tooltip');
  stage.addEventListener('pointerdown', e=>{drag=true;px=e.clientX;py=e.clientY;});
  addEventListener('pointerup', ()=>drag=false);
  stage.addEventListener('pointermove', e=>{
    const r = stage.getBoundingClientRect();
    if(drag){ tx += (e.clientX-px)*.005; ty += (e.clientY-py)*.005; px=e.clientX; py=e.clientY; }
    mv.x = ((e.clientX-r.left)/r.width)*2-1; mv.y = -((e.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(mv, camera);
    const hits = ray.intersectObjects(Object.values(meshes).map(p=>p.hit).filter(Boolean));
    if(hits.length){
      const n = hits[0].object.userData.node;
      tip.style.display='block'; tip.style.left=(e.clientX-r.left+14)+'px'; tip.style.top=(e.clientY-r.top+10)+'px';
      tip.innerHTML = '<b>'+esc(n.label)+'</b>'
        +(n.kind==='metric'?'异动指标 · 点击左侧指标卡可聚焦'
          :esc(CLAIM_ZH[n.claim]||'候选')+(n.derived?' · 导数派生值':' · 因子本体')
          +(n.human?'<br><span style="color:#ffb765">✦ 人为确认 / 干预过（治理留痕）</span>':'')
          +(n.kind==='alerted'?'<br><span style="color:#ff7772">⚠ 高风险预警中</span>':''))
        +(n.strength!=null?'<br>置信度（关联强度）：'+pct(n.strength):'')+(n.lag!=null?' · lag '+n.lag:'')
        +(n.kind==='metric'?'':n.claim==='WATCHLIST'?'<br><span style="color:var(--cc-cyan)">点击去待办看板确认</span>':n.kind!=='unknown'?'<br><span style="color:var(--cc-cyan)">点击跳转因子库</span>':'');
      stage.style.cursor='pointer';
    } else { tip.style.display='none'; stage.style.cursor='grab'; }
  });
  stage.addEventListener('click', ()=>{
    ray.setFromCamera(mv, camera);
    const hits = ray.intersectObjects(Object.values(meshes).map(p=>p.hit).filter(Boolean));
    if(hits.length){ const n=hits[0].object.userData.node;
      if(n.kind==='alerted'){ openAlertFromGlobe(n.id); }
      else if(n.claim==='WATCHLIST'){ showView('todo'); }
      else if(n.kind!=='unknown'&&n.kind!=='metric'){ showView('library'); focusFactor(n.fid||n.id); } }
  });
  const t0 = performance.now();
  (function anim(){
    if(!stage.isConnected) return;
    requestAnimationFrame(anim);
    const t=(performance.now()-t0)/1000;
    if(!drag) ty += .0019;
    scene.rotation.y += (ty-scene.rotation.y)*.045;
    scene.rotation.x += (tx*.4-scene.rotation.x)*.045;
    Object.values(meshes).forEach(p=>{
      if(p.n.kind==='metric'){ p.m.rotation.y += .01; if(p.core) p.core.rotation.y -= .014; return; }
      p.m.scale.setScalar(1+Math.sin(t*2+p.m.position.x)*.05);
      if(p.ring){ p.ring.lookAt(camera.position); p.ring.scale.setScalar(1+Math.sin(t*3)*.12); }
    });
    labels.forEach(({div, pack})=>{
      const v = pack.m.position.clone().applyMatrix4(scene.matrixWorld).project(camera);
      const front = v.z<1;
      div.style.display = front?'':'none';
      div.style.left = ((v.x*.5+.5)*W)+'px'; div.style.top = ((-v.y*.5+.5)*H+46)+'px';
    });
    renderer.render(scene, camera);
  })();
  return { selectMetric(mid){
    Object.values(meshes).forEach(p=>{
      const dim = mid && p.n.kind!=='metric' && !edges.some(e=>e.metric===mid && e.b===p.n.id);
      const dimM = mid && p.n.kind==='metric' && p.n.id!=='metric:'+mid;
      const op = (dim||dimM)? .12 : 1;
      p.m.material.opacity = op; p.m.material.transparent = true;
      if(p.core){ p.core.material.opacity=op; p.core.material.transparent=true; }
      if(p.ring){ p.ring.material.opacity = (dim||dimM)? .1 : .85; }
    });
    edgeObjs.forEach(rec=> rec.objs.forEach(o=>{ o.material.opacity = (!mid||rec.metric===mid)? (o.material.dashSize?.8:.9) : .06; }));
  } };
}

function initGlobe2D(stage, nodes, edges){
  const W = stage.clientWidth||600, H = stage.clientHeight||470;
  const cv = document.createElement('canvas'); cv.width=W*2; cv.height=H*2; cv.style.width=W+'px'; cv.style.height=H+'px';
  stage.appendChild(cv);
  const ctx = cv.getContext('2d'); ctx.scale(2,2);
  const CSS_COLOR = {metric:'#57e4d0', internal:'#5da7ff', external:'#9c8cff', unknown:'#ffb765', verified:'#73ff9f', alerted:'#ff7772'};
  const metricCount = nodes.filter(n=>n.kind==='metric').length;
  const outers = nodes.filter(n=>n.kind!=='metric');
  const pts = {};
  nodes.forEach(n=>{
    if(n.kind==='metric'){ pts[n.id]={n, x:0, y:metricCount===1?0:(n.mi-(metricCount-1)/2)*.52, z:0}; return; }
    if(n.kind==='unknown'){ pts[n.id]={n, x:0, y:.92, z:0}; return; }
    const i=n.idx, total=outers.length;
    const phi=Math.acos(1-2*(i+.5)/total), theta=Math.PI*(1+Math.sqrt(5))*i;
    pts[n.id]={n, x:Math.sin(phi)*Math.cos(theta), y:Math.cos(phi)*.8, z:Math.sin(phi)*Math.sin(theta)};
  });
  let spin=0, dimMetric=null;
  (function anim(){
    if(!cv.isConnected) return;
    requestAnimationFrame(anim); spin+=.008;
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='rgba(59,139,153,.25)'; ctx.beginPath(); ctx.arc(W/2,H/2,H*.38,0,7); ctx.stroke();
    const proj={};
    Object.values(pts).forEach(p=>{
      const x=p.x*Math.cos(spin)-p.z*Math.sin(spin), z=p.x*Math.sin(spin)+p.z*Math.cos(spin);
      proj[p.n.id]={...p, sx:W/2+x*H*.38, sy:H/2+p.y*H*.38, depth:z};
    });
    edges.forEach(e=>{
      const A=proj[e.a],B=proj[e.b]; if(!A||!B) return;
      const dim = dimMetric && e.metric!==dimMetric;
      ctx.globalAlpha = dim? .06 : (e.style==='causal'? .95 : .3+.5*(e.strength||0));
      ctx.strokeStyle = e.style==='causal'?'#73ff9f':e.style==='assoc'?'#57e4d0':e.style==='abtest'?'#5da7ff':e.style==='watch'?'#ffb765':'#9c8cff';
      ctx.lineWidth = e.style==='causal'? 2.5 : e.style==='assoc'||e.style==='abtest'? 1.6 : 1;
      ctx.setLineDash(e.style==='watch'||e.style==='temporal'?[4,3]:[]);
      ctx.beginPath(); ctx.moveTo(A.sx,A.sy); ctx.lineTo(B.sx,B.sy); ctx.stroke();
    });
    ctx.setLineDash([]); ctx.lineWidth=1; ctx.globalAlpha=1;
    Object.values(proj).forEach(p=>{
      const linked = !dimMetric || p.n.kind==='metric' && ('metric:'+dimMetric)===p.n.id || edges.some(e=>e.metric===dimMetric && e.b===p.n.id);
      const r = p.n.kind==='metric'?11:4+Math.min(6,(p.n.strength||0)*6);
      ctx.globalAlpha = (p.depth>0?.95:.35) * (dimMetric&&!linked? .15:1);
      if(p.n.kind==='metric'){ ctx.strokeStyle='#57e4d0'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(p.sx,p.sy,r,0,7); ctx.stroke();
        ctx.fillStyle='#57e4d0'; ctx.beginPath(); ctx.arc(p.sx,p.sy,4,0,7); ctx.fill(); }
      else { const rr = p.n.derived? r*.7 : r;
        if(p.n.derived){ ctx.strokeStyle = CSS_COLOR[p.n.kind]||'#5da7ff'; ctx.beginPath(); ctx.arc(p.sx,p.sy,rr,0,7); ctx.stroke(); }
        else { ctx.fillStyle = CSS_COLOR[p.n.kind]||'#5da7ff'; ctx.beginPath(); ctx.arc(p.sx,p.sy,rr,0,7); ctx.fill(); }
        if(p.n.kind==='alerted'||p.n.kind==='verified'){ ctx.strokeStyle=CSS_COLOR[p.n.kind]; ctx.beginPath(); ctx.arc(p.sx,p.sy,rr+4,0,7); ctx.stroke(); } }
      if(p.depth>0){ ctx.fillStyle=p.n.human?'#ffb765':(p.n.kind==='metric'?'#57e4d0':'#86a9b3'); ctx.font=(p.n.kind==='metric'?'bold ':'')+'10px Menlo'; ctx.textAlign='center'; ctx.fillText(p.n.label+(p.n.kind!=='metric'&&p.n.conf!=null?' '+Math.round(Math.abs(p.n.conf)*100)+'%':'')+(p.n.human?' ✦':''), p.sx, p.sy-r-6); }
      ctx.globalAlpha=1;
    });
  })();
  return { selectMetric(mid){ dimMetric = mid; } };
}
function openAlertFromGlobe(fidOrAlert){
  const a = D.alerts.find(x=>x.alert_id===fidOrAlert) || D.alerts.find(x=>x.factor_id===fidOrAlert);

<script>
/* ================= 02 风险预警中心 ================= */

function renderAlerts(){

    <div class="filter-bar">${chips.map(c=>`<span class="chip ${ALERT_FILTER===c[0]?'on':''}" onclick="ALERT_FILTER='${c[0]}';renderAlerts()">${c[1]}</span>`).join('')}</div>
  </div>
  <div id="alert-list">${list.map(renderAlertCard).join('')||'<div class="card" style="color:var(--muted)">该分类下暂无预警</div>'}</div>`;
  list.forEach(a=>{ if(a.trend) drawSpark('spark-'+a.alert_id, a.trend); });

function renderAlertCard(a){
  const st = a.state.status;
  const lvlPill = a.level==='high' ? '<span class="pill red">⚠ 高风险</span>' : '<span class="pill gold">关注</span>';
  const typePill = a.type==='conflict' ? '<span class="pill violet">冲突预警 · 违背已验证结论</span>' : '<span class="pill blue">趋势预警</span>';
  let ops = '';
  if(st==='open') ops = `<button class="btn small" onclick="alertAct('${a.alert_id}','confirm')">确认风险</button>
    <button class="btn small danger" onclick="alertDismiss('${a.alert_id}')">误报</button>`;
  else if(st==='confirmed') ops = `<button class="btn small" onclick="alertAct('${a.alert_id}','adopt')">采纳建议 → 处置中</button>`;
  else if(st==='adopted') ops = `<button class="btn small ghost" onclick="alertAct('${a.alert_id}','close')">效果回看完成 → 闭环</button>`;
  const stateNote = st!=='open' ? `<span class="state-tag">${STATUS_ZH[st]}${a.state.operator?' · '+esc(a.state.operator):''}${a.state.reason?' · '+esc(a.state.reason):''}${a.state.local?' · 本地留痕':''}</span>` : '';
  const conflictJump = a.type==='conflict' ? `<div class="row">依据结论：<span class="jump-link" onclick="showView('library');focusFactor('${esc(a.factor_id)}')">${esc(a.conclusion.name)} → ${esc(a.conclusion.metric)}（已验证，方向${zhDir(a.conclusion.direction)}）→ 因子库查看</span></div>` : '';
  let falsify = '';
  if(a.falsification){
    const f=a.falsification;
    const gate=(label, obj, detail)=>{
      if(!obj) return `<span class="pass">✓ ${label}</span>`;
      if(obj.applicable===false||obj.skipped) return `<span style="color:var(--muted)">— ${label}（不适用）</span>`;
      return obj.kill?`<span class="fail">✗ ${label}（击杀）</span>`:`<span class="pass">✓ ${label}${detail||''}</span>`;};
    falsify = `<div class="falsify">三杀证伪：${gate('安慰剂', f.placebo, f.placebo?`（安慰剂相关 ${(f.placebo.correlation||0).toFixed(2)}，覆盖 ${(f.placebo.coverage||0).toFixed(2)}）`:'')}
      ${gate('先后倒置', f.lead_lag_reversal, f.lead_lag_reversal?`（倒置后相关 ${(f.lead_lag_reversal.correlation||0).toFixed(2)}）`:'')}
      ${gate('半分稳定', f.split_half, f.split_half?`（前半 ${(f.split_half.first||0).toFixed(2)} / 后半 ${(f.split_half.second||0).toFixed(2)}）`:'')}</div>`;
  }
  return `<div class="alert-card ${a.level}" id="alert-${a.alert_id}">

    ${a.trend?`<canvas class="spark" id="spark-${a.alert_id}"></canvas>`:''}
    ${conflictJump}
    <div class="row"><b>预计影响：</b>${esc(a.impact)}</div>
    <div class="row"><b>建议动作：</b>${esc(a.suggestion)}</div>
    ${falsify}
    <div class="ops">${ops}</div>
  </div>`;
}
function drawSpark(id, trend){
  const cv = document.getElementById(id); if(!cv) return;
  const W=220,H=44; cv.width=W*2; cv.height=H*2; const ctx=cv.getContext('2d'); ctx.scale(2,2);
  const res = trend.residual||[], fac = trend.factor||[];
  const line=(data,color)=>{ if(!data.length) return;
    const mx=Math.max(...data.map(Math.abs))||1;
    ctx.strokeStyle=color; ctx.beginPath();
    data.forEach((v,i)=>{ const x=i/(data.length-1)*W, y=H/2-(v/mx)*(H/2-4); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.stroke(); };
  line(res,'rgba(100,118,128,.7)'); line(fac,'#00a8a8');
}
function alertAct(alertId, action){

}
function alertDismiss(alertId){

  } else {
    const a = it.data;

      <div class="ops"><button class="btn" onclick="todoFeedback('${esc(it.key)}','${esc(a.alert_id)}','confirm')">有用</button>

  }

      <div class="rule cannot"><b>✗ 人工不能做</b>${esc(s.cannot)}</div>
    </div>
    ${evidence}${form}`;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer-mask').classList.add('open');
  document.getElementById('drawer-mask').onclick = closeDrawer;

/* ---- 异动下钻：先看资源位拆解，判断整体下滑还是个别下滑 ---- */
function bizDrill(key){
  const k = BIZ_KPIS.concat(BIZ_SLOTS).find(x=>x.key===key);
  const el = document.getElementById('biz-drill');
  if(!k){return;}
  let body='';
  if(key==='ctr'){
    const total = BIZ_SLOTS.reduce((s,x)=>s+Number(x.extra),0);
    const rows = BIZ_SLOTS.map(x=>{const share=Number(x.extra)/total; const contrib=share*x.yoy; return {...x,share,contrib};});
    const sumContrib = rows.reduce((s,x)=>s+x.contrib,0);
    const top = rows.slice().sort((a,b)=>a.contrib-b.contrib)[0];
    const topShare = Math.abs(top.contrib)/(rows.reduce((s,x)=>s+Math.abs(x.contrib),0));
    const verdict = topShare>=0.5
      ? `<div class="ws-callout" style="border-left:3px solid var(--red)"><b>判定：个别资源位主导。</b>${esc(top.name)} 贡献 ${fmtDelta(top.contrib)}（占资源位总下滑 ${Math.round(topShare*100)}%），超过其余位置总和 —— 不是全盘流量质量问题，优先排查该位置切面。</div>`
      : `<div class="ws-callout"><b>判定：整体下滑。</b>各资源位普遍下行，无单一主导位置 —— 优先排查全局性外部因子与链路变更。</div>`;
    body = `${verdict}
    <table class="full"><tr><th>资源位</th><th>曝光占比</th><th>同比</th><th>对整体 CTR 的贡献</th><th>贡献分布</th></tr>
    ${rows.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${(x.share*100).toFixed(1)}%</td><td style="color:${x.yoy<0?'var(--red)':'inherit'}">${fmtDelta(x.yoy)}</td><td><b style="color:${x.contrib<0?'var(--red)':'inherit'}">${fmtDelta(x.contrib)}</b></td><td><div style="height:6px;background:#edf1f3;border-radius:3px"><div style="height:6px;border-radius:3px;width:${Math.min(100,Math.abs(x.contrib)/Math.abs(top.contrib)*100)}%;background:${x.contrib<0?'var(--red)':'var(--green)'}"></div></div></td></tr>`).join('')}</table>
    <div style="font-size:11.5px;color:var(--muted);margin-top:6px">资源位合计解释 ${fmtDelta(sumContrib)}，占整体同比 ${fmtDelta(k.yoy)} 的 ${Math.round(Math.abs(sumContrib/k.yoy)*100)}%；未解释部分保留为残差，不强行摊派（演示口径：贡献 = 曝光占比 × 单位同比）。</div>`;
  } else {
    body = `<div class="ws-callout"><b>${esc(k.name)}</b> 暂无可拆解的资源位/运营位维度（演示数据仅 CTR 链路挂载了位置明细）。整体下滑还是个别下滑，需要在指标契约中登记拆解维度后自动展开 —— 当前可直接进入因子实验室走标准调查流程。</div>`;
  }
  el.innerHTML = `<div class="card" style="border:1px solid var(--blue)"><h3>下钻：${esc(k.name)} · 同比 ${fmtDelta(k.yoy)} / 环比 ${fmtDelta(k.mom)}
    <span style="float:right;font-size:12px;font-weight:400"><a style="color:var(--blue);cursor:pointer" onclick="wsExpStart('${k.key}')">对该异动发起实验排查 →</a> · <a style="color:var(--muted);cursor:pointer" onclick="document.getElementById('biz-drill').innerHTML=''">收起 ✕</a></span></h3>
    ${body}</div>`;
  el.scrollIntoView({block:'start',behavior:'smooth'});
}

/* 切面样本集：周期切面（每周一）或垂直切面（逐日），范围 15/30/60 天，演示口径 */
function expSlices(){
  const k = BIZ_KPIS.concat(BIZ_SLOTS).find(x=>x.key===EXP.anomaly)||{yoy:-6.8};
  const jit = [-1.3, 2.1, -0.4, 3.2, -2.2, 0.8, -1.7, 1.4, -0.9, 2.6, 1.1, -2.8, 0.5];
  const out = [];
  if(EXP.mode==='cycle'){
    const mondays = ['09-14','09-07','08-31','08-24','08-17','08-10','08-03','07-27','07-20','07-13'];
    mondays.slice(0, Math.max(2, Math.round(EXP.range/7))).forEach((d,i)=> out.push({date:'2026-'+d, tag:`每周一 · 近${EXP.range}天`, yoy:+(k.yoy+jit[i%jit.length]).toFixed(1)}));
  } else {
    const n = EXP.range;
    for(let i=0;i<n;i++){ const dt=new Date(2026,8,20-i); const mm=String(dt.getMonth()+1).padStart(2,'0'), dd=String(dt.getDate()).padStart(2,'0');
      out.push({date:`2026-${mm}-${dd}`, tag:`近${n}天 · 逐日`, yoy:+(k.yoy+jit[i%jit.length]*0.8).toFixed(1)}); }
  }
  return out;
}
/* 同形态判定：正向切面只数同向异动，双向切面涨跌都算 */
function expIsAbnormal(s, k, rules){
  if(EXP.direction==='both') return Math.abs(s.yoy)>=rules.yoy;
  return k.yoy<0 ? s.yoy<=-rules.yoy : s.yoy>=rules.yoy;
}

  const el = document.getElementById('exp-wizard'); if(!el) return;
  const flagged = BIZ_KPIS.concat(BIZ_SLOTS).filter(k=>['alert','severe'].includes(bizStatus(k,bizRules())));
  let body = `<p class="ws-muted" style="margin:8px 0 10px"><b>① 选择异动</b>（与总控今日异动清单同源，从总控点「发起实验排查」会自动带到这里；当前判定策略下共 ${flagged.length} 项）：</p>
    <div class="filter-bar">${flagged.map(k=>`<span class="chip ${EXP.anomaly===k.key?'on':''}" style="cursor:pointer" onclick="wsExpReset('${k.key}')">${esc(k.name)} · ${fmtDelta(k.yoy)}</span>`).join('')||'<span class="ws-muted">无异动，<a style="color:var(--blue);cursor:pointer" onclick="wsExpReset(\'ctr\')">用演示异动：整体 CTR −6.8%</a></span>'}</div>`;
  if(EXP.anomaly){
    const k = BIZ_KPIS.concat(BIZ_SLOTS).find(x=>x.key===EXP.anomaly);
    const slices = expSlices();
    const rulesNow = bizRules();
    const abnormal = slices.filter(s=>expIsAbnormal(s,k,rulesNow));
    const showRows = slices.slice(0,10);
    const cfg = (label, inner)=>`<div style="border:1px solid var(--line);border-radius:8px;padding:10px 12px"><div style="font-size:11px;color:var(--muted);margin-bottom:6px">${label}</div>${inner}</div>`;
    const opt = (cur,val,text,onclick)=>`<span class="chip ${cur===val?'on':''}" style="cursor:pointer" onclick="${onclick}">${text}</span>`;
    body += `<div style="margin-top:14px"><b>② 实验配置</b> —— 实验对象：<b>${esc(k.name)}</b>（同比 ${fmtDelta(k.yoy)}）</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0">

      ${cfg('切面方向',opt(EXP.direction,'down','正向切面 · 仅同向异动','EXP.direction=\'down\';EXP.done=false;EXP.stage=-1;renderExpWizard()')+' '+opt(EXP.direction,'both','双向切面 · 涨跌都计','EXP.direction=\'both\';EXP.done=false;EXP.stage=-1;renderExpWizard()'))}
      ${cfg('切法',opt(EXP.mode,'cycle','周期切面 · 每周一','EXP.mode=\'cycle\';EXP.done=false;EXP.stage=-1;renderExpWizard()')+' '+opt(EXP.mode,'recent','垂直切面 · 逐日','EXP.mode=\'recent\';EXP.done=false;EXP.stage=-1;renderExpWizard()'))}
      ${cfg('滞后扫描窗口',[3,7,14].map(n=>opt(EXP.lag,n,'lag 0–'+n,`EXP.lag=${n};EXP.done=false;EXP.stage=-1;renderExpWizard()`)).join(' '))}
      ${cfg('校正强度',opt(EXP.strict,'strict','严格 · max-T + 封存窗','EXP.strict=\'strict\';renderExpWizard()')+' '+opt(EXP.strict,'standard','标准 · 仅 max-T','EXP.strict=\'standard\';renderExpWizard()'))}
      ${cfg('豁免期样本',opt(EXP.includeExempt,false,'剔除豁免期','EXP.includeExempt=false;EXP.done=false;EXP.stage=-1;renderExpWizard()')+' '+opt(EXP.includeExempt,true,'包含（不推荐）','EXP.includeExempt=true;EXP.done=false;EXP.stage=-1;renderExpWizard()'))}
    </div>
    <div style="font-size:11.5px;color:var(--muted);margin-bottom:8px">配置即检验契约：范围与切法决定样本量，方向决定"同形态"口径，lag 窗口与校正强度直接进入搜索账本 —— 账本越厚，校正门越严。</div>
    <table class="full"><tr><th>异常切面样本</th><th>切法</th><th>同比</th><th>判定</th></tr>
    ${showRows.map(s=>`<tr><td><b>${s.date}</b></td><td style="color:var(--muted)">${s.tag}</td><td style="color:${s.yoy<0?'var(--red)':'inherit'}">${fmtDelta(s.yoy)}</td><td>${expIsAbnormal(s,k,rulesNow)?'<span class="pill red">同形态异动</span>':'<span class="pill green">对照样本</span>'}</td></tr>`).join('')}
    ${slices.length>10?`<tr><td colspan="4" style="color:var(--muted)">… 共 ${slices.length} 个切面</td></tr>`:''}</table>
    <div style="font-size:12px;margin-top:8px">样本集：<b>${slices.length}</b> 个切面，其中 <b style="color:var(--red)">${abnormal.length}</b> 个同形态异常（${EXP.direction==='both'?'双向口径':'仅同向'}）—— 扩样后的异常切面集合将作为关联计算的取证范围。</div>

  }

function wsExpPick(key){ wsExpReset(key); }
function expLog(msg, cls){ const t=((Date.now()-EXP.t0)/1000).toFixed(1); EXP.logs.push({t, msg, cls:cls||''}); const el=document.getElementById('exp-log'); if(el){ el.innerHTML=EXP.logs.map(l=>`<div><span class="t">[+${l.t}s]</span><span class="${l.cls}">${l.msg}</span></div>`).join('')+(EXP.running?'<span class="exp-cursor"></span>':''); el.scrollTop=el.scrollHeight; } }
function renderExpPipeline(){
  const el = document.getElementById('exp-pipeline'); if(!el) return;
  if(EXP.stage<0 && !EXP.running){ el.innerHTML=''; return; }
  el.innerHTML = `<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:4px">${EXP_STAGES.map((s,i)=>{
    const st = i<EXP.stage?'done':(i===EXP.stage?(EXP.running?'run':'done'):'');
    const dot = st==='done'?'<span class="pill green">✓</span>':st==='run'?'<span class="pill gold">运行中</span>':'<span class="pill">等待</span>';
    return `<span style="display:flex;align-items:center;gap:5px;font-size:12px;${st?'':'opacity:.5'}">${dot}${s}</span>${i<EXP_STAGES.length-1?'<span style="color:var(--muted)">→</span>':''}`;}).join('')}
    <span class="mono" id="exp-clock" style="margin-left:auto;font-size:12px;color:var(--muted)"></span></div>
  <div class="exp-log" id="exp-log"></div>`;
  const el2=document.getElementById('exp-log'); if(el2) el2.innerHTML=EXP.logs.map(l=>`<div><span class="t">[+${l.t}s]</span><span class="${l.cls}">${l.msg}</span></div>`).join('')+(EXP.running?'<span class="exp-cursor"></span>':'');
}
function wsExpRun(){
  if(EXP.running || !EXP.anomaly) return;
  const k = BIZ_KPIS.concat(BIZ_SLOTS).find(x=>x.key===EXP.anomaly);
  const slices = expSlices();
  const rulesNow = bizRules();
  const abnormal = slices.filter(s=>Math.abs(s.yoy)>=rulesNow.yoy).length;
  EXP.running=true; EXP.done=false; EXP.stage=0; EXP.runId++; EXP.logs=[]; EXP.t0=Date.now();
  const runId=EXP.runId;
  const fids = [...new Set((D.metrics||[]).flatMap(m=>(m.factors||[]).map(l=>l.factor_id)))];
  window._expReveal = new Set();
  if(document.getElementById('globe-stage')) renderNetwork();
  renderExpWizard(); renderExpPipeline();
  setTimeout(()=>{ const el=document.getElementById('exp-pipeline'); if(el) el.scrollIntoView({block:'start',behavior:'smooth'}); },120);
  expLog(`实验启动 · 对象「${k.name}」 · ${EXP.mode==='cycle'?'周期切面（每周一）':'垂直切面（逐日）'} × 近${EXP.range}天 · ${EXP.direction==='both'?'双向异动口径':'仅同向异动'} · lag 0–${EXP.lag} · ${EXP.strict==='strict'?'严格校正（max-T+封存窗）':'标准校正（max-T）'}${EXP.includeExempt?' · 含豁免期样本':''}`, 'run');
  if(EXP._clk) clearInterval(EXP._clk);
  EXP._clk=setInterval(()=>{ const c=document.getElementById('exp-clock'); if(c) c.textContent='⏱ '+((Date.now()-EXP.t0)/1000).toFixed(1)+'s'; },100);
  const advance = ()=>{
    if(EXP.runId!==runId) return;
    if(EXP.stage===0){ expLog(`切面取样完成 · ${slices.length} 个切面入样，${abnormal} 个同形态异常、${slices.length-abnormal} 个对照`, 'ok'); }
    if(EXP.stage===1){ expLog(`滞后对齐完成 · 统一 lag 0–${EXP.lag} 天扫描窗口，切面时间轴已锁定`, 'ok'); }
    if(EXP.stage===2){
      const next = fids.filter(f=>!window._expReveal.has(f)).slice(0,2);
      next.forEach(f=>window._expReveal.add(f));
      next.forEach(f=>expLog(`关联检验 · ${zhName(f)} → 候选关联显现于证据球`, 'run'));
      renderNetwork();
      if(next.length){ setTimeout(advance, 800); return; }
      expLog(`关联检验完成 · ${fids.length} 个候选因子全部扫描`, 'ok');
    }
    if(EXP.stage===3){ expLog('搜索记账完成 · 全部比较次数入账，max-T 校正门随样本量收紧', 'warn'); }
    if(EXP.stage===4){ expLog(EXP.strict==='strict'?'封存窗验证完成 · 存活候选进入结论清单，未通过者保留为负结果':'标准模式 · 无封存窗验证，结论上限为关联级', 'ok'); }
    EXP.stage++;
    if(EXP.stage>=EXP_STAGES.length){
      EXP.running=false; EXP.done=true; clearInterval(EXP._clk);
      window._expReveal.add('unknown'); renderNetwork();
      expLog('实验结束 · 证据球已定格，待确认因子可发起实验验证', 'ok');
      renderExpWizard(); renderExpPipeline(); renderExpResult();
      return;
    }
    renderExpPipeline();
    setTimeout(advance, EXP.stage===2?450:1000);
  };
  setTimeout(advance, 800);
}

      <td>${confirmed?'<span style="font-size:11px;color:var(--muted)">绿环在库</span>':`<button class="btn small" onclick="wsExpRequest('${esc(c.factor_id)}','${esc(k.name)}')">发起实验验证 →</button>`}</td></tr>`;}).join('')}</table>
    <div style="font-size:11.5px;color:var(--muted);margin-top:8px">「待人工确认」的关联因子无法直接写结论 —— 发起实验验证后进入「人工审核任务」排队，独立窗口确认前永远停在关联层。未解释部分保留为残差，不强行摊派。</div>
    <div class="ws-actions" style="margin-top:10px"><button class="btn ghost" onclick="showView('todo')">去人工审核任务 →</button><button class="btn ghost" onclick="wsExpPick(EXP.anomaly)">调整切面重跑</button></div>`;
  el.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function bizRules(){ try{ return Object.assign({yoy:5,mom:8,exempt:[],groups:{},savedAt:null}, JSON.parse(localStorage.getItem(BIZ_RULES_KEY)||'{}')); }catch(e){ return {yoy:5,mom:8,exempt:[],groups:{},savedAt:null}; } }
function bizStatus(k,rules){
  if(k.ex && rules.exempt.includes(k.ex)) return 'exempt';
  const t = bizThreshold(k,rules);
  const r = Math.max(Math.abs(k.yoy)/t.yoy, Math.abs(k.mom)/t.mom);
  if(r>=1.5) return 'severe';
  if(r>=1) return 'alert';
  if(r>=0.6) return 'watch';
  return 'ok';
}

 const a=wsArtifact(WS_CASE),data=WS_LIVE||a.data||{},c=WS_CASES[WS_CASE],root=data.result||data,pub=wsPublication(data);

async function wsSaveDream(form){const button=form.querySelector('button[type=submit]');try{const op=operator(),f=new FormData(form),body=Object.fromEntries(f);body.operator=op;body.request_id=form.dataset.requestId||(form.dataset.requestId=rid());['horizon','budget','change_percent','threshold_percent'].forEach(k=>body[k]=Number(body[k]));button.disabled=true;if(MODE==='service'){const r=await fetch('/api/v2/scenarios/propose',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok||j.error)throw new Error(j.error||'保存失败');D.workspace.scenario_proposals=[j,...(D.workspace.scenario_proposals||[]).filter(x=>x.scenario_id!==j.scenario_id)];}else{pushLedger({type:'dream_proposal',proposal:{...body,created_at:new Date().toISOString(),status:'LOCAL_DRAFT',claim_type:'SCENARIO_ONLY',estimate:null,interval:null,production_action:false}});}toast(MODE==='service'?'研究提案已保存；等待补数与统计推演':'已保存本地草稿，未提交服务器');renderDream();}catch(e){toast(e.message,true);button.disabled=false;}}
function wsComponentTable(items=[]){const names={'carousel.image_component':'图片组件','carousel.indicator_position':'指示器位置','carousel.layout':'布局','carousel.media_aspect_ratio':'媒体宽高比','carousel.text_density':'文字密度'};return `<div class="ws-table-wrap"><table class="ws-table"><tr><th>组件</th><th>实验效应</th><th>证据判决</th></tr>${items.map(x=>`<tr><td>${esc(names[x.factor_id]||x.factor_id)}</td><td><b>${wsPP(x.component_effect)}</b><div style="height:5px;background:#edf1f3;margin-top:7px"><div style="height:5px;width:${Math.min(100,Math.abs(x.component_effect)*4000)}%;background:${x.significant?'var(--red)':'#a4b2b8'}"></div></div></td><td>${x.evidence_level==='COMPONENT_EFFECT'?'独立随机化支持':'证据不足，继续验证'}</td></tr>`).join('')}</table></div><p class="ws-muted">灰色项保留负结果；组件效应不直接加总为整套效果。</p>`;}
function wsFunnel(f={}){return `<div class="ws-table-wrap"><table class="ws-table"><tr><th>经营漏斗</th><th>旧版人数</th><th>新版人数</th><th>阶段率差</th></tr>${(f.stages||[]).map(x=>`<tr><td>${esc(x.label)}</td><td>${x.control}</td><td>${x.treatment}</td><td>${wsPP(x.delta)}</td></tr>`).join('')}</table></div><p class="ws-muted">${esc(f.fixture_note||'各阶段分母见指标契约')}</p>`;}
function wsClaims(l={}){return `<details class="ws-detail"><summary>结论怎样逐步升级 · ${(l.claims||[]).length} 条</summary>${(l.claims||[]).map(x=>`<div class="ws-stage"><div><span class="ws-tag">${esc(x.claim_type)}</span><p>${esc(x.statement)}</p><p class="ws-muted">允许：${esc((x.allowed_verbs||[]).join(' / '))}<br>禁止：${esc((x.prohibited_verbs||[]).join(' / '))}<br>证据引用：${(x.evidence_refs||[]).length||'此历史样例未提供引用，不能视为完整审计链'}</p></div></div>`).join('')}</details>`;}
function wsEstimatorPanel(){return `<div class="card"><h3>三种定量方法：估计值必须和适用条件一起读</h3><p class="ws-muted">以下是不同历史验证样例，不是本次问题的三轨共识。目标量、时间窗或数据不同，不取均值、不投票升级结论。</p><div class="ws-grid" style="margin-top:14px">${[['bsts','结构时间序列','用稳定对照预测干预前后的反事实'],['scm','合成控制','用未受影响的对照组合构造基线'],['gcm','广义因果模型','条件于已接受的因果图与机制模型']].map(([id,title,note])=>{const a=wsArtifact(id),c=a.data?.contracts||{},e=c.EffectEstimate||{};return `<div class="ws-contract"><strong>${id.toUpperCase()} · ${title}</strong><p class="ws-muted">${note}</p><div class="ws-number" style="font-size:22px;margin-top:10px">${wsNumber(e.estimate)}</div><p class="ws-muted">区间 ${(e.interval||[]).map(x=>wsNumber(x)).join(' ～ ')||'暂无'}<br>${esc(e.estimand||'未提供')} · ${esc(e.unit||'')}<br>窗口 ${esc((e.window||[]).join('–'))} · ${esc(e.selection_status||'')}</p><button class="btn small ghost" onclick="wsOpenEvidence('${id}')">核查假设与原件</button></div>`}).join('')}</div></div>`;}
function renderWorkspace(){renderInvestigation();renderExpWorkbench();renderEvidenceWorkspace();renderDream();enhanceLibrary();enhanceHuman();enhanceEvolution();}
function enhanceHuman(){const expReqs=ledger().filter(e=>e.type==='experiment_request');document.getElementById('view-todo').insertAdjacentHTML('beforeend',`<div class="card"><h3>异动实验验证请求 <span style="font-size:11px;color:var(--muted);font-weight:400">来自总控「异动实验工作台」——无法人工确认的关联因子，排队等待独立窗口实验验证</span></h3>${expReqs.map(e=>`<div class="ws-stage"><span>↳</span><div><b>${esc(zhName(e.factor_id))}</b> <span class="mono" style="font-size:10.5px;color:var(--muted)">${esc(e.factor_id)}</span><p class="ws-muted">异动对象：${esc(e.anomaly||'—')} · 发起人 ${esc(e.operator||'—')} · ${esc((e.at||'').slice(0,16))}</p><p class="ws-state">待验证 · 确认前停在关联层，不写入任何因果结论</p></div></div>`).join('')||'<p class="ws-muted">暂无实验验证请求；可在总控对一场异动发起实验排查。</p>'}</div><div class="card"><h3>补证后的统计验证队列</h3><p class="ws-muted">提交事实后仍待验证。只有新窗口证据满足门禁，结论才可能升级。</p>${(D.queue||[]).map(q=>`<div class="ws-stage"><span>↳</span><div><b>${esc(q.factor_id||q.id)}</b><p class="ws-state">${esc(q.status)}</p>${wsDetails('队列来源与窗口资格',q)}</div></div>`).join('')||'<p class="ws-muted">暂无待验证补证。</p>'}</div>`);document.getElementById('view-todo').insertAdjacentHTML('afterbegin',`<div class="ws-hero"><div class="ws-eyebrow">HUMAN IN THE LOOP</div><h1>让业务事实进入调查，让高风险动作等待拍板。</h1><p>系统说明卡在哪里，人补充机器看不到的事实。补证会留痕并进入后续验证；审批不会改变统计结论。</p></div><div class="ws-journey" style="grid-template-columns:repeat(4,1fr)">${[['候选确认','事实成立 / 否决，不代表因果成立'],['证据冲突','补事件时间、影响范围与机制'],['发布审批','独立审查后，批准技能受控发布'],['告警反馈','真阳性 / 误报，校准下一窗预算']].map(x=>`<div class="ws-step"><strong>${x[0]}</strong><small>${x[1]}</small></div>`).join('')}</div>`);}
function enhanceEvolution(){document.getElementById('view-evolution').insertAdjacentHTML('afterbegin',`<div class="ws-hero"><div class="ws-eyebrow">RSI / ORGANIZATIONAL MEMORY</div><h1>经验不随人走，结论每次重验。</h1><p>把一次排查的成功与失败，变成下一次的检查步骤、适用条件和验证模板。统计参数记忆与技能方法记忆分别验收。</p></div><div class="card"><h3>一条经验如何成为可用技能</h3><div class="ws-flow"><span>G0 捕获双源轨迹</span>→<span>G1 方法补丁</span>→<span>G2 独立审查</span>→<span>G5 冻结配对回放</span>→<span>G3 审批 / ≤10% 首发</span>→<span>G4 下窗复用</span>↺<span>G6 归因 / 缩域 / 回滚</span></div><p class="ws-muted">冲突与缺证据进入 AUDIT_ONLY；环境失败记 ISSUE；没有新规则则 NOOP。独立审查是角色与进程分离，生产身份与流量平台仍需接入。</p></div><div class="two-col"><div class="card"><h3>方法记忆</h3><p class="ws-muted">例如“检查两组外部暴露是否平衡”。需要独立任务回放、范围检查与审批；不能复用“上次是版本导致下降”。</p>${D.skills.map(s=>wsDetails(`${s.name} v${s.version} · 生命周期原件`,s.lifecycle)).join('')}</div><div class="card"><h3>参数记忆</h3><p class="ws-muted">Beta 先验、衰减、封顶与漂移反馈有独立消融产物，收益不可当作 RSI 技能收益。低流量窗口改善不代表所有窗口改善。</p><div class="ws-actions"><button class="btn ghost" onclick="wsOpenEvidence('experience')">查看跨期消融</button><button class="btn ghost" onclick="wsOpenEvidence('negative')">查看无增益记录</button></div></div></div>`);}
function enhanceLibrary(){
  const NS=[['acquisition','获客',35,'渠道级下钻：6 渠道 × 出价/素材/排名'],['conversion','转化',45,'环节级下钻：8 漏斗环节 × 转化率'],['experience','体验',38,'位置级/端级：6 资源位 × 版本配置 · 4 端 × 性能/崩溃'],['service','服务',25,'客服/理赔 + 监管通报'],['mix','结构',14,'身份/产品/渠道快照'],['quality','质量',10,'实验平台 + SRM + 质量监控'],['activation','激活',10,'内部埋点 / 实名链路'],['external','外部',9,'监管 / 宏观（挂真实来源）'],['retention','留存',5,'保单日历 / 触达配置']];
  const research=wsData().research||[];
  const nsTotal=NS.reduce((s,x)=>s+x[2],0);
  document.getElementById('view-library').insertAdjacentHTML('afterbegin',`<div class="card ws-library-extra"><h3>因子库全景 · ${nsTotal} 候选因子 / 9 命名空间</h3><div class="ws-grid"><div><div class="ws-number">${wsData().registry_count??D.factors.length}</div><p class="ws-muted">注册表在管因子</p></div><div><div class="ws-number">${research.length}</div><p class="ws-muted">概念级研究候选 · 附完整操作化定义</p></div><div><div class="ws-number">${nsTotal}</div><p class="ws-muted">命名空间下钻后的候选总数（方案口径）</p></div></div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px">${NS.map(n=>{const mine=research.filter(f=>f.factor_id.startsWith(n[0]+'.')).length;return `<div style="border:1px solid var(--line);border-radius:8px;padding:12px"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>${n[1]} <span class="mono" style="font-size:10.5px;color:var(--muted)">${n[0]}</span></b><span style="font-size:18px;font-weight:700">${n[2]}</span></div><div style="font-size:11px;color:var(--muted);margin-top:4px">${n[3]}</div>${mine?`<div style="font-size:11px;color:var(--cyan);margin-top:4px">已落地概念级定义 ${mine} 条，可在下方检索</div>`:''}</div>`;}).join('')}</div>
  <div class="ws-boundary">计数口径：${nsTotal} = 38 条概念级候选按「位置级（6 资源位）/ 渠道级（6 渠道）/ 环节级（8 漏斗）/ 端级（4 端）/ 产品族（5 族）」下钻展开，每条落在真实系统位置、来源可核；非机械叉乘灌水。已加载概念级定义 ${research.length} 条 + 注册表 ${wsData().registry_count??D.factors.length} 条；其余下钻条目随数据映射接入逐条激活。</div><div class="ws-actions"><button class="btn ghost" onclick="wsShowResearch()">检索角色、来源与验证陷阱 →</button></div></div>`);
}
function wsShowResearch(){document.getElementById('drawer-mask').onclick=closeDrawer;document.getElementById('drawer-body').innerHTML=`<h2>研究因子定义与来源</h2><p class="ws-muted">研究依据支持机制或测量定义；本业务效应尚未验证，数据授权映射仍需补齐。</p><input style="width:100%;padding:10px;margin:15px 0" placeholder="搜索名称、角色、公式或来源" aria-label="搜索研究因子" oninput="wsResearchResults(this.value)"><div id="ws-research-results"></div>`;document.getElementById('drawer').classList.add('open');document.getElementById('drawer-mask').classList.add('open');wsResearchResults('');}
function wsResearchResults(query){const list=(wsData().research||[]).filter(f=>JSON.stringify(f).toLowerCase().includes(query.toLowerCase()));document.getElementById('ws-research-results').innerHTML=`<p class="ws-muted">找到 ${list.length} 项</p>`+list.map(f=>{const m=f.metadata||{};return `<div class="ws-stage"><div><b>${esc(f.name)}</b><p class="mono">${esc(f.factor_id)}</p><span class="ws-tag">${esc(m.causal_role)}</span><span class="ws-tag">${esc(m.priority)}</span><dl class="ws-kv"><dt>操作化公式</dt><dd>${esc(m.formula)}</dd><dt>需要数据</dt><dd>${esc(m.data_source)}</dd><dt>验证方式</dt><dd>${esc(m.validation)}</dd><dt>容易踩的陷阱</dt><dd>${esc(m.failure_mode)}</dd><dt>研究来源</dt><dd>${esc((m.source_ids||[]).join(', '))}</dd><dt>生产资格</dt><dd>${m.production_ready?'已声明就绪':'未就绪 · 待授权与数据映射'}</dd></dl>${wsDetails('时间契约、来源与完整定义',f)}</div></div>`}).join('');}
function wsSupplementForm(){document.getElementById('drawer-body').innerHTML=`<h2>为当前调查补证</h2><p class="ws-muted">绑定 ${esc(wsArtifact(WS_CASE).source)}。记录保留 source=human、修订关系与下一窗验证资格；不会修改历史结论。</p><form class="card" style="margin-top:16px" onsubmit="event.preventDefault();wsSubmitSupplement(this)"><label>相关因子</label><select name="factor_id">${wsDreamFactors().map(f=>`<option value="${esc(f.factor_id)}">${esc(f.name||f.factor_id)}</option>`).join('')}</select><label>当前窗口编号</label><input name="current_window" type="number" min="0" step="1" value="0" required><label>事实首次可用日（数据日索引）</label><input name="available_day" type="number" min="0" step="1" required><label>事实、事件时间、范围与来源引用</label><textarea name="note" required rows="5" placeholder="例如：某日分配日志缺失；补齐的日志位于……，覆盖……，记录版本为……"></textarea><button class="btn" style="margin-top:12px" type="submit">提交补证，进入待验证队列</button></form>`;document.getElementById('drawer').classList.add('open');document.getElementById('drawer-mask').classList.add('open');document.getElementById('drawer-mask').onclick=closeDrawer;}
async function wsSubmitSupplement(form){try{const op=operator(),f=Object.fromEntries(new FormData(form));const p={...f,operator:op,current_window:Number(f.current_window),available_day:Number(f.available_day),source:'human',evidence_ref:wsArtifact(WS_CASE).sha256,investigation_id:WS_CASE};const ok=await act('feedback',{kind:'factor_supplement',operator:op,payload:p},{type:'investigation_supplement',payload:p},'补证已存证，等待下一窗口统计验证');if(ok){closeDrawer();showView('todo');}}catch(e){toast(e.message,true);}}

function renderPlan(){
  const el = document.getElementById('view-plan');
  el.innerHTML = `
  <div class="card"><h3>详细方案 · 深度方案评审工作台 v17.1</h3>
    <div style="font-size:12.5px;color:var(--muted)">决赛完整技术方案：整体架构、L0→L1→识别门→L3 四层漏斗、三轨定量（实验 / 准实验 / 观测）、Human-in-the-loop 与发布门、证据包与审计链路。内嵌页面支持逐级下钻与动态演示；也可 <a href="plan-review.html" target="_blank" style="color:var(--blue)">新窗口打开 ↗</a>。</div>
  </div>
  <iframe src="plan-review.html" title="深度方案评审工作台 v17.1" style="width:100%;height:80vh;border:1px solid var(--line);border-radius:10px;background:#fff"></iframe>`;
}
function renderAll(){
  renderStrip(); renderOverview(); renderAlerts(); renderTodo(); renderLibrary(); renderManage(); renderEvolution(); renderSyslog(); renderWorkspace(); renderPlan();
  const off = document.getElementById('offline-strip');
  off.classList.toggle('show', MODE!=='service');
  const badge = document.getElementById('mode-badge');
  if(MODE==='service'){ badge.className='mode-badge online'; badge.textContent='已连接 · 历史证据 / 实时治理'; document.getElementById('rail-foot').textContent='HTTP 实机 · 操作落治理层'; }
  else { badge.className='mode-badge offline'; badge.textContent='本地脱敏数据回放'; document.getElementById('rail-foot').textContent='本地脱敏数据回放 · 可复现'; }
}
(async function boot(){
  const inp = document.getElementById('operator-input');
  inp.value = localStorage.getItem(LS_OPERATOR)||'';
  inp.addEventListener('change', ()=>localStorage.setItem(LS_OPERATOR, inp.value.trim()));
  if(location.protocol!=='file:'){
    try{ const raw = await fetchAll(); if(raw && raw.overview && !raw.overview.error){ MODE='service'; D=normalize(raw); } }catch(e){ console.warn('Service unavailable; using evidence snapshot:',e.message); }
  }
  if(!D){ MODE='offline'; D = normalize(INLINE||{}); }
  const hash = location.hash.replace('#','');
  const alias={investigation:'lab',dream:'lab',evidencepack:'lab',network:'overview',manage:'library'};
  renderAll();
  showView(VIEW_NAMES[hash]?hash:(alias[hash]||'overview'));
})();
